tTime(.001,t+.65);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.7);notes.push(o)}function play(){const melody=[392,440,494,523,494,440,392,330,349,392,440,392,349,330,294,330];let t=ctx.currentTime+.05;melody.forEach((f,i)=>tone(f,t+i*.43));timer=setTimeout(()=>{if(playing)play()},melody.length*430)}b.onclick=async()=>{if(playing){playing=false;clearTimeout(timer);notes.forEach(o=>{try{o.stop()}catch(e){}});notes=[];b.textContent='♫ Muzik';b.setAttribute('aria-pressed','false');return}ctx??=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();playing=true;b.textContent='❚❚ Henti';b.setAttribute('aria-pressed','true');play()};</script></body></html>
