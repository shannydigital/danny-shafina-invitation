<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b4b"><title>Jemputan Pertunangan Danny & Shafina</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#061b4b;font-family:Georgia,serif}.page{max-width:650px;margin:auto}.art{display:block;width:100%;height:auto}.section{position:relative}.count{padding:0 0 22px;text-align:center}.timer{display:flex;justify-content:center;gap:12px;margin:-70px auto 35px;position:relative;z-index:2;background:rgba(255,255,255,.95);width:max-content;max-width:95%;padding:10px 15px;border-radius:12px;box-shadow:0 3px 16px #061b4b15}.unit{min-width:55px}.unit strong{display:block;font-size:26px;font-weight:normal}.unit small{font-size:9px;letter-spacing:1px}.footer{text-align:center;padding:30px 16px 55px;font-size:13px;letter-spacing:.04em}.footer button{background:#061b4b;color:white;border:0;border-radius:25px;padding:13px 23px;font-family:inherit;cursor:pointer}.footer p{opacity:.65}img{user-select:none}@media(max-width:420px){.timer{margin-top:-50px;gap:7px;padding:8px}.unit{min-width:50px}.unit strong{font-size:22px}}</style></head><body><main class="page"><section class="section"><img class="art" src="assets/cover.png" alt="Kad jemputan Danny dan Shafina, 26 December 2026"></section><section class="section count"><img class="art" src="assets/countdown.png" alt="Counting Days"><div class="timer" aria-label="Kiraan detik ke 26 Disember 2026"><div class="unit"><strong id="d">0</strong><small>DAYS</small></div><div class="unit"><strong id="h">00</strong><small>HOURS</small></div><div class="unit"><strong id="m">00</strong><small>MINUTES</small></div><div class="unit"><strong id="s">00</strong><small>SECONDS</small></div></div></section><section><img class="art" src="assets/calendar.png" alt="Kalendar Disember 2026"></section><section><img class="art" src="assets/invitation.png" alt="Butiran jemputan majlis pertunangan"></section><footer class="footer"><button id="share">Kongsi Jemputan</button><p>Dengan ingatan tulus ikhlas, Danny & Shafina</p></footer></main><script>const target=new Date('2026-12-26T00:00:00+08:00').getTime();function tick(){let t=Math.max(0,Math.floor((target-Date.now())/1000));for(const [id,val] of [['d',Math.floor(t/86400)],['h',Math.floor(t%86400/3600)],['m',Math.floor(t%3600/60)],['s',t%60]])document.getElementById(id).textContent=id==='d'?val:String(val).padStart(2,'0')}tick();setInterval(tick,1000);document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:document.title,url:location.href})}catch(e){}}else{try{await navigator.clipboard.writeText(location.href);alert('Pautan telah disalin')}catch(e){prompt('Salin pautan:',location.href)}}};</script></body></html>
