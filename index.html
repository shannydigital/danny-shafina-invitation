svp-box{max-width:540px;margin:10px auto 55px;padding:26px;border:1px solid #cbd3e6;border-radius:18px;background:#fafbff;font:15px system-ui}.rsvp-box h2{text-align:center;font-family:Georgia;color:#081946}.rsvp-box label{display:block;margin:14px 0 6px}.rsvp-box input,.rsvp-box select{width:100%;padding:12px;border:1px solid #aab5cf;border-radius:9px;font:inherit}.rsvp-box button{width:100%;margin-top:18px}.rsvp-box p{font-size:12px;color:#485674}.actions{max-width:calc(100vw - 12px);overflow-x:auto} .countdown-wrap{position:relative;max-width:650px;margin:10px auto 35px}.countdown-wrap img{display:block;width:100%;height:auto}.countdown-values{position:absolute;left:15%;right:15%;top:49%;display:flex;justify-content:center;gap:clamp(6px,2vw,18px);font-family:Georgia,serif;color:#091946;text-align:center}.countdown-values div{min-width:0;flex:1}.countdown-values strong{display:block;font-size:clamp(18px,5vw,36px);font-weight:normal}.countdown-values span{font:clamp(9px,2vw,13px) system-ui,sans-serif}.countdown-note{text-align:center;font:13px system-ui;color:#091946;margin:0 0 18px}</style></head><body><main><section id="cover"><img src="assets/cover.png" alt="Kad jemputan Danny dan Shafina, 26 December 2026" fetchpriority="high"></section><section id="details"><img src="assets/details.png" alt="Butiran majlis pertunangan Che Shafina binti Mohammad Yusoff dan Danny Fitri Hakimi bin Kapli" loading="lazy"></section><section id="countdown" class="countdown-wrap"><div><img src="https://raw.githubusercontent.com/shannydigital/danny-shafina-invitation/main/assets/countdown.png" alt="Counting Days - bingkai hiasan biru navy" loading="lazy"><div class="countdown-values" role="timer" aria-label="Kiraan detik ke majlis"><div><strong id="cd-days">--</strong><span>Hari</span></div><div><strong id="cd-hours">--</strong><span>Jam</span></div><div><strong id="cd-mins">--</strong><span>Minit</span></div><div><strong id="cd-secs">--</strong><span>Saat</span></div></div></div></section><section id="calendar" class="calendar"><img src="assets/calendar.png" alt="Kalendar Disember 2026 dengan tarikh 26 ditandakan" loading="lazy"></section><section id="schedule" class="extra"><img src="https://raw.githubusercontent.com/shannydigital/danny-shafina-invitation/main/assets/schedule.png" alt="Atur cara majlis pertunangan bermula jam 4 petang hingga 9 malam" loading="lazy"></section><section id="location" class="extra"><div><div class="location-art"><img src="https://raw.githubusercontent.com/shannydigital/danny-shafina-invitation/main/assets/location.png" alt="Lokasi majlis di 99 Taman Putra 3 Azalea Sungai Buloh dan jemputan RSVP" loading="lazy"><a class="map-hotspot" href="https://maps.app.goo.gl/uztdhXfQQa1LdxfSA" target="_blank" rel="noopener noreferrer" aria-label="Buka lokasi majlis di Google Maps"></a><a class="rsvp-hotspot" href="rsvp.html" aria-label="Tekan kad RSVP untuk mengesahkan kehadiran" title="Sahkan kehadiran"></a></div></div></section><footer>Dengan penuh kesyukuran, kami menantikan kehadiran anda.</footer></main><nav class="actions" aria-label="Navigasi jemputan"><a class="action" href="#cover">Utama</a><a class="action" href="#details">Jemputan</a><a class="action" href="#countdown">Countdown</a><a class="action" href="#calendar">Tarikh</a><a class="action" href="#schedule">Atur Cara</a><a class="action" href="#location">Lokasi</a><button id="music" type="button" aria-pressed="false">♫ Muzik</button></nav><script>const b=document.querySelector('#music');let ctx,notes=[],playing=false,timer;function tone(freq,t){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.06);g.gain.exponentialRampToValueAtTime(.001,t+.65);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.7);notes.push(o)}function play(){const melody=[392,440,494,523,494,440,392,330,349,392,440,392,349,330,294,330];let t=ctx.currentTime+.05;melody.forEach((f,i)=>tone(f,t+i*.43));timer=setTimeout(()=>{if(playing)play()},melody.length*430)}b.onclick=async()=>{if(playing){playing=false;clearTimeout(timer);notes.forEach(o=>{try{o.stop()}catch(e){}});notes=[];b.textContent='♫ Muzik';b.setAttribute('aria-pressed','false');return}ctx??=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();playing=true;b.textContent='❚❚ Henti';b.setAttribute('aria-pressed','true');play()};const target=new Date('2026-12-26T16:00:00+08:00').getTime();function updateCountdown(){let remaining=Math.max(0,target-Date.now());const days=Math.floor(remaining/86400000);remaining%=86400000;const hours=Math.floor(remaining/3600000);remaining%=3600000;const mins=Math.floor(remaining/60000);const secs=Math.floor(remaining%60000/1000);[['cd-days',days],['cd-hours',hours],['cd-mins',mins],['cd-secs',secs]].forEach(([id,n])=>{document.getElementById(id).textContent=String(n).padStart(2,'0')})}updateCountdown();setInterval(updateCountdown,1000);</script></body></html>
