name: Deploy invitation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Enhance panel resolution for display
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          for file in Path("undangan").glob("panel-*.png"):
              with Image.open(file) as source:
                  im = source.convert("RGB")
                  im = im.resize((im.width * 3, im.height * 3), Image.Resampling.LANCZOS)
                  im = im.filter(ImageFilter.UnsharpMask(radius=1.3, percent=115, threshold=3))
                  im.save(file, "PNG", optimize=True)
          PY
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./undangan
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
