<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSVP | Danny & Shafina</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#091946;font-family:Georgia,serif}.wrap{max-width:560px;margin:30px auto;padding:22px}header{text-align:center;padding:30px 0}h1{font-size:38px;font-style:italic;font-weight:normal}p{text-align:center;line-height:1.7}form{border:1px solid #d4d9e5;background:#fafbff;border-radius:18px;padding:26px;font:15px system-ui}label{display:block;margin:16px 0 7px}input,select{width:100%;padding:13px;border:1px solid #aebbd3;border-radius:8px;font:inherit}button,.back{display:block;width:100%;text-align:center;padding:14px;border:0;border-radius:30px;background:#091946;color:white;font:600 15px system-ui;text-decoration:none;cursor:pointer;margin-top:22px}.back{background:white;color:#091946;border:1px solid #091946}small{display:block;text-align:center;margin-top:15px;line-height:1.5}</style></head><body><main class="wrap"><header><h1>RSVP</h1><h2>Danny &amp; Shafina</h2><p>Majlis Pertunangan<br>26 Disember 2026<br>Sila sahkan sebelum 20 Disember 2026</p></header><form id="rsvp"><label for="name">Nama tetamu</label><input id="name" required maxlength="100" placeholder="Nama penuh"><label for="status">Pengesahan kehadiran</label><select id="status" required><option value="">Sila pilih</option><option>Hadir</option><option>Tidak hadir</option></select><label for="count">Jumlah tetamu (termasuk anda)</label><input id="count" type="number" min="1" max="20" value="1" required><button type="submit">Hantar RSVP melalui WhatsApp</button><small>WhatsApp akan dibuka dengan mesej yang telah disediakan. Tekan Send untuk menghantar pengesahan.</small></form><a class="back" href="./">← Kembali ke Jemputan</a></main><script>document.getElementById('status').addEventListener('change',e=>{const c=document.getElementById('count');c.disabled=e.target.value==='Tidak hadir';c.required=!c.disabled});document.getElementById('rsvp').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),status=document.getElementById('status').value,count=document.getElementById('count').value;if(!name||!status)return;const msg=['Assalamualaikum, saya ingin mengesahkan RSVP Majlis Pertunangan Danny & Shafina (26 Disember 2026).','Nama: '+name,'Kehadiran: '+status,'Jumlah tetamu: '+(status==='Hadir'?count:'0')].join('\n');location.href='https://wa.me/60173845192?text='+encodeURIComponent(msg)});</script></body></html>
